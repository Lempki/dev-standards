# Reusable CI for the Python repositories that use dev-standards.
# Callers pick optional jobs through inputs. See the README for an example caller.

name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: The Python version used by every job.
        type: string
        default: "3.12"
      forward-python-version:
        description: A newer Python version that runs the tests once more. Empty skips it.
        type: string
        default: ""
      mypy:
        description: Whether to run the typecheck job.
        type: boolean
        default: false
      mypy-target:
        description: The path mypy checks.
        type: string
        default: src
      docker:
        description: Whether to build the Docker image.
        type: boolean
        default: false
      lfs:
        description: Whether to check out Git LFS files.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.lfs }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ inputs.python-version }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.lfs }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  # The tests run on a newer Python too, so an upgrade's breakage shows up before the upgrade.
  test-forward:
    if: ${{ inputs.forward-python-version != '' }}
    name: test (Python ${{ inputs.forward-python-version }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.lfs }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ inputs.forward-python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  typecheck:
    if: ${{ inputs.mypy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy ${{ inputs.mypy-target }}

  docker:
    if: ${{ inputs.docker }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.lfs }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
