# Reusable workflow that publishes a repository's Docker image to the GitHub Container Registry.
# Callers run it when a version tag such as v1.2.0 is pushed. See the README for an example caller.
# The image is named after the repository, such as ghcr.io/lempki/api-media.
# It gets the tags 1.2.0, 1.2, and latest, so a machine that pulls latest gets the newest release.

name: Docker publish

on:
  workflow_call:
    inputs:
      platforms:
        description: The platforms to build for, separated by commas.
        type: string
        default: linux/amd64,linux/arm64
      lfs:
        description: Whether to check out Git LFS files.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.lfs }}
      # Image names must be lowercase, while the owner's name may not be.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # QEMU builds the arm64 image on the amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
