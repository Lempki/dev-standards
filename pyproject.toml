[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-dev-standards"
version = "0.1.3"
description = "Shared conventions, pre-commit hooks, and CI for the Discord bot and API repositories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dev-standards = "dev_standards.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "mypy>=1.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dev_standards"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.dev-standards.prose]
# The rule tables in the tests quote violations on purpose.
exclude = ["tests/**"]
